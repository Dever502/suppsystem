groups:
  - name: suppsystem
    rules:
      - alert: SuppsystemFailedDeliveryJobs
        expr: suppsystem_failed_jobs{queue="delivery"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Suppsystem has failed Telegram delivery jobs
          description: "{{ $value }} delivery jobs are failed. Check suppsystem logs and the outbox runbook."

      - alert: SuppsystemFailedNotificationJobs
        expr: suppsystem_failed_jobs{queue="notification"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Suppsystem has failed notification webhook jobs
          description: "{{ $value }} notification jobs are failed. Check webhook receiver health and retry policy."

      - alert: SuppsystemOldDeliveryQueue
        expr: suppsystem_queue_oldest_age_seconds{queue="delivery"} > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Suppsystem delivery queue is old
          description: "Oldest delivery job is older than 5 minutes. Check Telegram API errors and delivery worker progress."

      - alert: SuppsystemOldNotificationQueue
        expr: suppsystem_queue_oldest_age_seconds{queue="notification"} > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Suppsystem notification queue is old
          description: "Oldest notification job is older than 5 minutes. Check receiver availability and Retry-After responses."

      - alert: SuppsystemWorkerHeartbeatStale
        expr: suppsystem_heartbeat_age_seconds > 60
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Suppsystem worker heartbeat is stale
          description: "{{ $labels.component }} heartbeat is stale. Check /ready, container health and worker logs."

      - alert: SuppsystemPanelUnknownOutcome
        expr: suppsystem_panel_unknown > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Remnawave action outcome requires manual reconciliation
          description: "{{ $value }} Remnawave actions have unknown outcome. Do not repeat mutations before manual reconciliation."

      - alert: SuppsystemExternalRequestFailures
        expr: increase(suppsystem_events_total{outcome=~"failed|retry|unknown|unexpected_response|http_5xx|request_error"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Suppsystem external integration failures detected
          description: "External integration failures or retries increased in the last 15 minutes. Check component and outcome labels."
