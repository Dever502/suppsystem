name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.27"
  IMAGE_NAME: ghcr.io/dever502/suppsystem

jobs:
  quality:
    name: Static quality and policy checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv and restore dependency cache
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install dependencies
        run: uv sync --frozen --all-groups
      - name: Run static quality and policy checks
        env:
          UV_NO_SYNC: "1"
        run: sh scripts/check_quality.sh

  tests:
    name: Tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTEST_WORKERS: "4"
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv and restore dependency cache
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install dependencies
        run: uv sync --frozen --all-groups
      - name: Run tests with coverage
        env:
          UV_NO_SYNC: "1"
        run: sh scripts/test_unit.sh

  postgres_matrix:
    name: PostgreSQL 16 matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.14-alpine3.22@sha256:786dab398303b8ce7cb76b407bb21ef2e4dfbbbd4c6abcf3d29b3130467ffdbc
        env:
          POSTGRES_DB: suppsystem_test
          POSTGRES_USER: suppsystem_test
          POSTGRES_PASSWORD: suppsystem-test-only-password
        options: >-
          --health-cmd "pg_isready -U suppsystem_test -d suppsystem_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      TEST_POSTGRES_DATABASE_URL: postgresql+asyncpg://suppsystem_test:suppsystem-test-only-password@127.0.0.1:5432/suppsystem_test
      ALLOW_POSTGRES_TEST_DATABASE_CREATION: "yes"
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv and restore dependency cache
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install dependencies
        run: uv sync --frozen --all-groups
      - name: Run PostgreSQL tests
        env:
          UV_NO_SYNC: "1"
        run: sh scripts/test_postgres.sh

  build_image:
    name: Build, scan, and publish image
    if: github.event_name == 'push'
    needs:
      - quality
      - tests
      - postgres_matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare immutable image metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          build_date=$(git show --no-patch --format=%cI "$GITHUB_SHA")
          image_tag="$IMAGE_NAME:$GITHUB_SHA"
          {
            echo "build_date=$build_date"
            echo "image_tag=$image_tag"
            echo "tags<<EOF"
            echo "$image_tag"
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "$IMAGE_NAME:${GITHUB_REF_NAME}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build candidate image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          build-args: |
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}
            VCS_REF=${{ github.sha }}
          context: .
          labels: |
            org.opencontainers.image.source=https://github.com/Dever502/suppsystem
          load: true
          provenance: false
          push: false
          tags: ${{ steps.metadata.outputs.tags }}
          cache-from: type=gha,scope=suppsystem-image
          cache-to: type=gha,mode=max,scope=suppsystem-image
      - name: Export candidate for socketless scanners
        env:
          IMAGE_TAG: ${{ steps.metadata.outputs.image_tag }}
        run: |
          set -euo pipefail
          docker image save --output suppsystem-image.tar "$IMAGE_TAG"
          chmod 0644 suppsystem-image.tar
      - name: Prepare Trivy database cache key
        id: trivy_cache_key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .trivy-cache/db
          printf 'date=%s\n' "$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Restore Trivy vulnerability database cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .trivy-cache/db
          key: trivy-db-${{ runner.os }}-v0.70.0-${{ steps.trivy_cache_key.outputs.date }}
          restore-keys: |
            trivy-db-${{ runner.os }}-v0.70.0-
      - name: Smoke-test candidate image
        env:
          IMAGE_TAG: ${{ steps.metadata.outputs.image_tag }}
        run: |
          docker run --rm \
            --env MIGRATION_DATABASE_URL=sqlite+aiosqlite:////tmp/suppsystem-smoke.db \
            --entrypoint sh \
            "$IMAGE_TAG" \
            -c 'set -eu
              cd /app
              test "$(python -c "import suppsystem; print(suppsystem.__version__)")" = "3.0.0"
              test -f /app/alembic.ini
              test -f /app/migrations/env.py
              python -c "from hashlib import sha256; from pathlib import Path; assert sha256(Path(\"/app/LICENSE\").read_bytes()).hexdigest() == \"d81f7122bd70d76feebbd3634701488586b0bcc21b8bd90e1e1edf0acc4e8be7\""
              python -m suppsystem.migrations
              python -c "import sqlite3; from alembic.config import Config; from alembic.script import ScriptDirectory; current = sqlite3.connect(\"/tmp/suppsystem-smoke.db\").execute(\"SELECT version_num FROM alembic_version\").fetchone()[0]; assert [current] == ScriptDirectory.from_config(Config(\"/app/alembic.ini\")).get_heads()"'
      - name: Create Trivy report and CycloneDX SBOM in parallel
        shell: bash
        run: |
          set -uo pipefail
          trivy_status=0
          syft_status=0
          runner_uid=$(id -u)
          runner_gid=$(id -g)

          docker run --rm \
            --user "$runner_uid:$runner_gid" \
            --env HOME=/tmp \
            --security-opt no-new-privileges \
            --volume "$PWD:/work:ro" \
            --volume "$PWD/.trivy-cache:/cache" \
            --workdir /work \
            aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e \
            --cache-dir /cache image --input suppsystem-image.tar --format json > trivy.json &
          trivy_pid=$!

          docker run --rm \
            --user "$runner_uid:$runner_gid" \
            --env HOME=/tmp \
            --security-opt no-new-privileges \
            --volume "$PWD:/work:ro" \
            --workdir /work \
            anchore/syft:v1.44.0-debug@sha256:6dd8fb28e1b799e7cadaff6be2ec6d555757c4eeec0c0e48162f20b042ffa1ff \
            "docker-archive:/work/suppsystem-image.tar" -o cyclonedx-json > sbom.cdx.json &
          syft_pid=$!

          wait "$trivy_pid" || trivy_status=$?
          wait "$syft_pid" || syft_status=$?
          if (( trivy_status != 0 || syft_status != 0 )); then
            printf 'Security report generation failed: trivy=%s syft=%s\n' \
              "$trivy_status" "$syft_status" >&2
            exit 1
          fi
      - name: Enforce HIGH and CRITICAL vulnerability gate
        run: python3 scripts/check_trivy_report.py trivy.json
      - name: Publish verified image
        id: publish
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.metadata.outputs.image_tag }}
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -euo pipefail
          push_output="$(docker push "$IMAGE_TAG" 2>&1)"
          printf '%s\n' "$push_output"
          image_digest="$(printf '%s\n' "$push_output" \
            | sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' \
            | tail -n 1)"
          test -n "$image_digest"
          while IFS= read -r tag; do
            if [ -n "$tag" ] && [ "$tag" != "$IMAGE_TAG" ]; then
              docker push "$tag"
            fi
          done < <(printf '%s\n' "$IMAGE_TAGS")
          echo "digest=$image_digest" >> "$GITHUB_OUTPUT"
      - name: Record immutable image reference
        id: image
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE_TAG: ${{ steps.metadata.outputs.image_tag }}
        run: |
          set -euo pipefail
          image_reference="$IMAGE_NAME@$IMAGE_DIGEST"
          printf 'IMAGE_DIGEST=%s\nIMAGE_REFERENCE=%s\nIMAGE_TAG=%s\n' \
            "$IMAGE_DIGEST" "$image_reference" "$IMAGE_TAG" > image.env
          echo "reference=$image_reference" >> "$GITHUB_OUTPUT"
      - name: Create release evidence
        run: |
          sha256sum sbom.cdx.json trivy.json > artifact-checksums.txt
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            sed -n 's/^IMAGE_TAG=/image_tag=/p; s/^IMAGE_REFERENCE=/image_reference=/p' image.env
            cat artifact-checksums.txt
          } > release-evidence.txt
      - name: Attest published image
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            artifact-checksums.txt
            image.env
            release-evidence.txt
            sbom.cdx.json
            trivy.json
