[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "suppsystem"
version = "3.5.0"
description = "Telegram-first, panel-optional support platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Dever502" }]
dependencies = [
  "aiogram>=3.17,<4",
  "aiohttp>=3.14.3,<4",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pillow>=12.3,<13",
  "uvicorn[standard]>=0.34,<1",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy[asyncio]>=2.0.36,<3",
]

[project.scripts]
suppsystem = "suppsystem.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/suppsystem"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "postgres: requires an isolated disposable PostgreSQL test cluster",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI uses these calls as declarative endpoint metadata, not mutable defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["suppsystem"]

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=6,<8",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.8,<1",
]
