groups:
  - name: supportbot
    rules:
      - alert: SupportbotFailedDeliveryJobs
        expr: support_failed_jobs{queue="delivery"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Supportbot has failed Telegram delivery jobs
          description: "{{ $value }} delivery jobs are failed. Check supportbot logs and the outbox runbook."

      - alert: SupportbotFailedNotificationJobs
        expr: support_failed_jobs{queue="notification"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Supportbot has failed notification webhook jobs
          description: "{{ $value }} notification jobs are failed. Check webhook receiver health and retry policy."

      - alert: SupportbotOldDeliveryQueue
        expr: support_queue_oldest_age_seconds{queue="delivery"} > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Supportbot delivery queue is old
          description: "Oldest delivery job is older than 5 minutes. Check Telegram API errors and delivery worker progress."

      - alert: SupportbotOldNotificationQueue
        expr: support_queue_oldest_age_seconds{queue="notification"} > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Supportbot notification queue is old
          description: "Oldest notification job is older than 5 minutes. Check receiver availability and Retry-After responses."

      - alert: SupportbotWorkerHeartbeatStale
        expr: support_heartbeat_age_seconds > 60
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Supportbot worker heartbeat is stale
          description: "{{ $labels.component }} heartbeat is stale. Check /ready, container health and worker logs."

      - alert: SupportbotPanelUnknownOutcome
        expr: support_panel_unknown > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Remnawave action outcome requires manual reconciliation
          description: "{{ $value }} Remnawave actions have unknown outcome. Do not repeat mutations before manual reconciliation."

      - alert: SupportbotExternalRequestFailures
        expr: increase(support_events_total{outcome=~"failed|retry|unknown|unexpected_response"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Supportbot external integration failures detected
          description: "External integration failures or retries increased in the last 15 minutes. Check component and outcome labels."
